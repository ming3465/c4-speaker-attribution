[project]
name = "main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]
# Figures only. The instrument itself runs on the standard library alone, so
# this stays out of `dependencies` and out of the dev group the tests use.
figures = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: builds stores over the pilot bundle (several seconds)"]
